# Keeps the free Supabase project from pausing. Free projects pause after about a week with no use; this asks
# the database a tiny question once a day, which counts as use. Setup: docs/sync-setup.md ("Keep the project awake").
#
# GitHub switches scheduled workflows off after 60 days with no activity in a public repository. The weekly job in
# keep-workflows-enabled.yml switches this one back on before that happens (docs/sync-setup.md, "Keep the scheduled jobs
# switched on"); if it ever is off, the Actions tab shows an "Enable workflow" button.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_URL       the Project URL, e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (the same public key that is in js/sync-config.js)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'        # every day at 06:17 UTC
  workflow_dispatch:            # and a "Run workflow" button, to try it

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write             # only to report a failure (last step)
    steps:
      - name: Ask the database one cheap question
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (docs/sync-setup.md)."
            exit 1
          fi
          # Without a signed-in user the table's privacy rules return an empty list ([]): that is the right answer.
          # Any 2xx means the database woke up and answered.
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/sync_items?select=id&limit=1"
          echo
          echo "Supabase answered."

      # If anything above failed, open (or add a comment to) ONE issue, because GitHub's own failure emails of scheduled
      # jobs may go to nobody (to whoever last edited the schedule, or to the github-actions bot after a re-enable).
      # Only the job's name and the run's link go in it, never logs or secrets. Same step in every scheduled workflow.
      - name: Tell the owner this job failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_NAME: Keep Supabase awake
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Study Sprint: a scheduled job failed'; label=scheduled-job-failed
          gh label create "$label" --color B60205 --description "A scheduled job failed (made by the jobs themselves)" >/dev/null 2>&1 || true
          num=$(gh issue list --label "$label" --state open --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty" || true)
          msg="The scheduled job \"$JOB_NAME\" failed on $(date -u +%Y-%m-%d). Open the run to see why: $RUN_URL . What to do: docs/sync-setup.md, step 8d. Close this issue when it is fixed."
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$msg"
          else
            gh issue create --title "$title" --label "$label" --assignee "$GITHUB_REPOSITORY_OWNER" --body "$msg"
          fi
