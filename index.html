<script>
  // Apply the saved theme before anything is drawn, so there's no flash of the wrong colors.
  // This mirrors cleanTheme() in js/themes.js (keep the two in step): unknown or old theme names become
  // Violet, and with nothing saved the app is Original Violet Dark, even when the device is set to light.
  // (The catch below also sets data-ui, so a broken saved value never leaves the page without one.)
  try {
    var t = JSON.parse(localStorage.getItem('study-sprint-theme') || '{}'), r = document.documentElement;
    var skins = { violet: 1, ocean: 1, forest: 1, ember: 1, rose: 1 };
    var old = { sage: 'forest', matcha: 'forest', cobalt: 'ocean', shinkansen: 'ocean', blossom: 'rose', sakura: 'rose' };
    var skin = skins[t.skin] ? t.skin : (old[t.skin] || 'violet');
    var dark = ['neon', 'onyx', 'kuro'].indexOf(t.skin) >= 0;
    var mode = dark ? 'dark' : (t.mode === 'light' || t.mode === 'auto') ? t.mode : 'dark';
    if (mode === 'auto') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-ui', t.ui === 'clinical' ? 'clinical' : 'original');
    r.setAttribute('data-skin', skin);
    r.setAttribute('data-theme', mode);
    if (t.oled === true || t.skin === 'onyx' || t.skin === 'kuro') r.setAttribute('data-oled', 'on');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); document.documentElement.setAttribute('data-ui', 'original'); }
  // The desktop sidebar's collapsed (icon rail) state is remembered per device the same way (see js/sidebar.js).
  try { if (localStorage.getItem('study-sprint-rail') === '1') document.documentElement.setAttribute('data-rail', 'on'); } catch (e) { /* fine */ }
</script>
<!-- Integrity for the libraries the app imports from the CDN: the browser refuses a file whose SHA-384 fingerprint differs,

     tests/integrity.test.js checks every versioned CDN module in js/ has an entry. -->

    "https://cdn.jsdelivr.net/npm/ts-fsrs@5.4.2/dist/index.mjs": "sha384-OeqvdN9AydEUN/AbwPmQJUIpNEccDtOW7Agq8BEILaYEkupNtqgV0p2ijEwzAOM0",

    "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs": "sha384-Z4EKe5a5DXkOl0inZS9gbLhWC3oWGsUGEe39GJ62+77NMKyfNjPWtP1Ilgb1Jzzy"
